# Application Configuration
spring.application.name=financial-planner
server.port=5000
server.address=0.0.0.0

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false

# H2 Database Configuration (Dev/Prod: Use MySQL/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:financialdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.financialplanner=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# 🤖 AI CONFIGURATION - OPENAI GPT
# ============================================
# This application uses OpenAI for intelligent financial analysis
# Get your API key at: https://platform.openai.com/
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini
ai.openai.base-url=https://api.openai.com/v1/chat/completions
