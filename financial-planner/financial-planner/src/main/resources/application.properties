# Application Configuration
spring.application.name=financial-planner
server.port=5000
server.address=0.0.0.0

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false

# H2 Database Configuration (Dev/Prod: Use MySQL/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:financialdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.financialplanner=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# 🤖 AI CONFIGURATION - ANTHROPIC CLAUDE
# ============================================
# This application uses Anthropic Claude for intelligent financial analysis
# Get your API key at: https://console.anthropic.com/
# 
# PRIMARY AI ENGINE - Claude 3.5 Sonnet (Advanced Intelligence)
ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
ai.anthropic.model=claude-3-5-sonnet-20241022
ai.anthropic.base-url=https://api.anthropic.com/v1/messages

# Anthropic Claude Features:
# ✓ Smart transaction categorization
# ✓ Personalized spending recommendations 
# ✓ Real-time financial insights
# ✓ Budget optimization suggestions
# ✓ Anomaly detection
# ✓ Advanced reasoning capabilities

# Legacy AI Services (DEPRECATED - Use Anthropic Claude Instead)
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=gpt-4o-mini
ai.openai.base-url=https://api.openai.com/v1/chat/completions

ai.ollama.enabled=false
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=llama3.2
ai.ollama.timeout=30000

# Digital Wallet Integration
digital-wallet.url=http://localhost:8080
digital-wallet.enabled=true

# Feign Configuration
spring.cloud.openfeign.client.config.digital-wallet.connect-timeout=5000
spring.cloud.openfeign.client.config.digital-wallet.read-timeout=10000
feign.circuitbreaker.enabled=true
