# Server Configuration
server.port=8081
spring.application.name=financial-planner-service

# OpenAI API Configuration
openai.api.key=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
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4
openai.timeout=30000

# Database Configuration (H2 In-Memory for Demo)
spring.datasource.url=jdbc:h2:mem:financialplanner
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON Data Import Configuration
wallet.data.import.path=classpath:wallet-transactions.json
wallet.data.import.enabled=true

# Main Wallet Service Integration
main.wallet.service.url=http://localhost:8080

# Caching Configuration
spring.cache.type=simple
spring.cache.cache-names=ai-recommendations,category-analysis

# Logging
logging.level.com.hackcash.financialplanner=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Health & Monitoring (for Kubernetes deployment)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
