# Application Configuration
spring.application.name=financial-planner
server.port=8081

# H2 Database Configuration (Dev/Prod: Use MySQL/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:financialdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JSON formatting
spring.jackson.serialization.indent-output=true

# Logging
logging.level.com.financialplanner=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# AI Configuration - Anthropic Claude
# ============================================
# Real AI-powered financial recommendations using Claude
ai.claude.api-key=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
ai.claude.model=claude-3-5-sonnet-20241022
ai.claude.base-url=https://api.anthropic.com/v1/messages

# Legacy Ollama Configuration (kept for reference)
ai.ollama.base-url=http://localhost:11434
ai.ollama.model=llama3.2
ai.ollama.timeout=30000
ai.ollama.enabled=false

# Digital Wallet Integration
digital-wallet.url=http://localhost:8080
digital-wallet.enabled=true

# Feign Configuration
spring.cloud.openfeign.client.config.digital-wallet.connect-timeout=5000
spring.cloud.openfeign.client.config.digital-wallet.read-timeout=10000
feign.circuitbreaker.enabled=true
